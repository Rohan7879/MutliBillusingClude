<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — MandiBook</title>

    <!-- Firebase Libraries -->
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Aapka Init File -->
    <script src="js/core/firebase-init.js"></script>

    <style>
      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #f0f4f8;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
      }
      .login-card {
        background: #fff;
        padding: 40px;
        border-radius: 12px;
        box-shadow: 0 10px 25px rgba(0, 90, 158, 0.1);
        width: 100%;
        max-width: 350px;
        text-align: center;
      }
      .login-card h2 {
        color: #005a9e;
        margin-bottom: 25px;
      }
      input {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border: 1.5px solid #dee2e6;
        border-radius: 8px;
        font-size: 15px;
        box-sizing: border-box;
      }
      input:focus {
        border-color: #005a9e;
        outline: none;
      }
      button {
        width: 100%;
        padding: 14px;
        background: #005a9e;
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
      }
      button:hover {
        background: #003d6e;
      }
      .login-help {
        display: block;
        width: auto;
        margin: 16px auto 0;
        padding: 0;
        background: transparent;
        color: #005a9e;
        font-size: 14px;
        font-weight: 700;
        text-decoration: underline;
      }
      .login-help:hover {
        background: transparent;
        color: #003d6e;
      }
      .login-note {
        margin: 14px 0 0;
        color: #6c757d;
        font-size: 12px;
        line-height: 1.45;
      }
      .divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 18px 0;
        color: #94a3b8;
        font-size: 12px;
      }
      .divider::before,
      .divider::after {
        content: "";
        height: 1px;
        background: #e2e8f0;
        flex: 1;
      }
      .google-login {
        background: #fff;
        color: #334155;
        border: 1.5px solid #d7dee7;
        box-shadow: none;
      }
      .google-login:hover {
        background: #f8fafc;
        color: #005a9e;
        border-color: #9fc8eb;
      }
    </style>
  </head>
  <body>
    <form class="login-card" id="login-form">
      <h2>MandiBook Secure Login</h2>
      <input type="email" id="email" placeholder="Email Address" autocomplete="email" required />
      <input type="password" id="password" placeholder="Password" autocomplete="current-password" required />
      <button type="submit">Login</button>
      <button type="button" class="login-help" id="forgot-password-btn">Forgot password?</button>
      <div class="divider">or</div>
      <button type="button" class="google-login" id="google-login-btn">🔵 Continue with Google</button>
      <p class="login-note">
        Only approved staff can access company records after signing in. New staff will complete their contact details
        before Admin approval.
      </p>
    </form>

    <script>
      function loginUser() {
        const email = document.getElementById("email").value.trim();
        const password = document.getElementById("password").value;

        if (!email || !password) {
          Swal.fire({ icon: "error", title: "Oops...", text: "Email aur Password zaruri hai!" });
          return;
        }

        const cooldownUntil = Number(localStorage.getItem("mandibook_login_cooldown_until") || 0);
        if (cooldownUntil > Date.now()) {
          const seconds = Math.ceil((cooldownUntil - Date.now()) / 1000);
          Swal.fire({
            icon: "info",
            title: "Please wait",
            text: `Too many failed attempts. Try again in ${seconds} seconds.`,
          });
          return;
        }

        // Firebase Login Function
        firebase
          .auth()
          .signInWithEmailAndPassword(email, password)
          .then((userCredential) => {
            localStorage.removeItem("mandibook_login_failures");
            localStorage.removeItem("mandibook_login_cooldown_until");
            Swal.fire({ icon: "success", title: "Login Successful", showConfirmButton: false, timer: 1500 }).then(
              () => {
                window.location.href = "index.html"; // Login ke baad Dashboard par bhejo
              }
            );
          })
          .catch((error) => {
            const failures = Number(localStorage.getItem("mandibook_login_failures") || 0) + 1;
            if (failures >= 5) {
              localStorage.setItem("mandibook_login_failures", "0");
              localStorage.setItem("mandibook_login_cooldown_until", String(Date.now() + 60 * 1000));
            } else {
              localStorage.setItem("mandibook_login_failures", String(failures));
            }
            const invalidCredentials =
              ["auth/wrong-password", "auth/user-not-found", "auth/invalid-credential"].includes(error.code) ||
              String(error.message || "").includes("INVALID_LOGIN_CREDENTIALS");
            Swal.fire({
              icon: "error",
              title: "Login Failed",
              text: invalidCredentials
                ? "Email/password galat hai, ya is email ka Firebase account abhi bana nahi hai."
                : error.message,
            });
          });
      }

      document.getElementById("login-form").addEventListener("submit", (event) => {
        event.preventDefault();
        loginUser();
      });

      document.getElementById("forgot-password-btn").addEventListener("click", async () => {
        const email = document.getElementById("email").value.trim();
        if (!email) {
          Swal.fire({
            icon: "info",
            title: "Enter your email",
            text: "Pehle apna registered email address likho, phir password reset link bhejenge.",
          });
          document.getElementById("email").focus();
          return;
        }
        try {
          await firebase.auth().sendPasswordResetEmail(email);
          Swal.fire({
            icon: "success",
            title: "Password reset link sent",
            html: `<p style="margin-bottom:8px;">We sent a secure password-reset link to:</p><strong>${email.replace(
              /</g,
              "&lt;"
            )}</strong><p style="margin-top:14px;color:#64748b;font-size:13px;">Please check your inbox and spam folder. For security, do not forward this link to anyone.</p>`,
            confirmButtonText: "Done",
            confirmButtonColor: "#005a9e",
          });
        } catch (error) {
          const invalidEmail = error.code === "auth/invalid-email";
          Swal.fire({
            icon: "error",
            title: "Could not send reset link",
            text: invalidEmail
              ? "Email address sahi format me likho."
              : "Reset link send nahi hua. Email address check karke dobara try karo.",
          });
        }
      });

      document.getElementById("google-login-btn").addEventListener("click", async () => {
        const button = document.getElementById("google-login-btn");
        button.disabled = true;
        button.textContent = "Opening Google...";
        try {
          const provider = new firebase.auth.GoogleAuthProvider();
          provider.setCustomParameters({ prompt: "select_account" });
          await firebase.auth().signInWithPopup(provider);
          // firebase-init.js verifies the staff profile and redirects either
          // to the app or to Access Pending after the popup completes.
        } catch (error) {
          console.error("Google sign-in failed", error);
          const cancelled = error.code === "auth/popup-closed-by-user" || error.code === "auth/cancelled-popup-request";
          Swal.fire({
            icon: cancelled ? "info" : "error",
            title: cancelled ? "Google sign-in cancelled" : "Google sign-in failed",
            text: cancelled
              ? "Aapne Google window close kar di."
              : "Google sign-in enable aur authorised domain check karke dobara try karo.",
          });
        } finally {
          button.disabled = false;
          button.textContent = "🔵 Continue with Google";
        }
      });
    </script>
  </body>
</html>
