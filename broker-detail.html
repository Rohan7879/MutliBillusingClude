<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Broker Details — MandiBook</title>
    <link rel="icon" href="assets/logo.jpg" />
    <link rel="stylesheet" href="css/main.css?v=14" />
    <link rel="stylesheet" href="css/workspaces.css?v=14" />
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/core/firebase-init.js?v=14"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/core-engine.js?v=14"></script>
    <script src="js/core/workspace-ui.js?v=14"></script>
    <script src="js/core/pwa.js?v=14" defer></script>
    <script src="js/core/payment-ui.js" defer></script>
    <script src="js/core/financial-year.js" defer></script>
    <script src="js/features/broker.js?v=14" defer></script>
    <script src="js/features/broker-detail.js?v=14" defer></script>
  </head>
  <body class="workspace-page">
    <div id="navbar-root"></div>
    <main class="broker-workspace">
      <a href="broker-ledger.html" class="workspace-back">← Broker directory</a>
      <header class="broker-hero">
        <div><p class="workspace-kicker">Broker account</p><h1 id="broker-detail-name">Broker details</h1><p id="broker-detail-contact">Bills, commission and payout history in one place.</p></div>
        <div><span id="broker-detail-sync" class="workspace-sync" aria-live="polite">Loading account…</span><button id="broker-detail-pay" class="workspace-action" hidden>Record payout</button></div>
      </header>
      <div class="broker-overview" id="broker-detail-summary"></div>
      <label for="broker-fy">Financial year</label><select id="broker-fy"><option value="all">All dates</option></select>
      <nav class="settings-nav" aria-label="Broker account views">
        <button type="button" data-broker-view="ledger" aria-pressed="false">Full ledger</button>
        <button type="button" data-broker-view="bills" aria-pressed="true">Commission bills</button>
        <button type="button" data-broker-view="payments" aria-pressed="false">Payout history</button>
      </nav>
      <section class="workspace-panel" id="broker-detail-content"><p>Loading broker account…</p></section>
    </main>
  </body>
</html>
