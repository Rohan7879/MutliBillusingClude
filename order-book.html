<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Order Book — MandiBook</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/core/firebase-init.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/core-engine.js"></script>
    <script src="js/features/company-profile.js"></script>
    <script src="js/features/themes.js" defer></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="icon" href="assets/logo.jpg" />
    <style>
      .top-navbar {
        position: sticky;
        top: 0;
        z-index: 1000;
        background: linear-gradient(135deg, var(--nav-from, #003d6e), var(--nav-to, #005a9e));
        box-shadow: 0 4px 20px rgba(0, 62, 110, 0.35);
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 62px;
        padding: 0 24px;
        margin: -20px -16px 24px;
      }
      .navbar-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        text-decoration: none;
      }
      .navbar-brand img {
        height: 38px;
        border-radius: 8px;
        border: 2px solid rgba(255, 255, 255, 0.3);
      }
      .navbar-brand span {
        color: #fff;
        font-size: 1.1em;
        font-weight: 800;
      }
      .navbar-links {
        display: flex;
        gap: 4px;
        align-items: center;
      }
      .nav-link {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 7px 13px;
        border-radius: 8px;
        color: rgba(255, 255, 255, 0.85);
        font-size: 13px;
        font-weight: 600;
        text-decoration: none;
        border: none;
        background: transparent;
        cursor: pointer;
        transition: all 0.2s;
        font-family: inherit;
      }
      .nav-link:hover,
      .nav-link.active {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
      }
      .pg {
        max-width: 960px;
        margin: 0 auto;
      }
      .sc {
        background: #fff;
        border-radius: 14px;
        padding: 22px 24px;
        margin-bottom: 18px;
        border: 1px solid #dee2e6;
        box-shadow: 0 2px 10px rgba(0, 90, 158, 0.07);
      }
      .sc-title {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        font-size: 0.9em;
        font-weight: 800;
        color: #005a9e;
        margin: 0 0 18px;
        padding-bottom: 11px;
        border-bottom: 2px solid #e7f3ff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      /* Order Cards */
      .order-card {
        background: #fff;
        border: 1.5px solid #dee2e6;
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
        box-shadow: 0 2px 8px rgba(0, 90, 158, 0.07);
        transition: all 0.2s;
      }
      .order-card:hover {
        box-shadow: 0 4px 16px rgba(0, 90, 158, 0.12);
        border-color: #b3d4f5;
      }
      .order-card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }
      .order-no {
        font-weight: 800;
        font-size: 1.1em;
        color: #005a9e;
      }
      .order-date {
        font-size: 13px;
        color: #6c757d;
      }
      .order-broker {
        font-size: 13px;
        font-weight: 600;
        color: #495057;
      }
      .status-badge {
        padding: 4px 12px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: 700;
      }
      .status-pending {
        background: #fff8e1;
        color: #a8710a;
        border: 1px solid #ffe08a;
      }
      .status-partial {
        background: #e3f2fd;
        color: #1565c0;
        border: 1px solid #90caf9;
      }
      .status-completed {
        background: #e8f5e9;
        color: #2e7d32;
        border: 1px solid #a5d6a7;
      }
      .status-cancelled {
        background: #ffebee;
        color: #c62828;
        border: 1px solid #ef9a9a;
      }

      /* Supplier rows */
      .supplier-row {
        display: grid;
        grid-template-columns: 2fr 1.5fr 1fr 1fr 1fr;
        gap: 8px;
        align-items: center;
        padding: 8px 0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
      }
      .supplier-row:last-child {
        border-bottom: none;
      }
      .supplier-row-header {
        font-weight: 800;
        font-size: 11px;
        color: #6c757d;
        text-transform: uppercase;
        letter-spacing: 0.4px;
      }
      .order-actions {
        display: flex;
        gap: 8px;
        margin-top: 12px;
      }

      /* Modal */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.55);
        z-index: 10000;
        display: none;
        justify-content: center;
        align-items: flex-start;
        overflow-y: auto;
        padding: 20px 16px;
        backdrop-filter: blur(3px);
      }
      .modal-overlay.open {
        display: flex;
      }
      .modal-box {
        background: #fff;
        border-radius: 16px;
        width: 100%;
        max-width: 720px;
        padding: 28px;
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.25);
        margin: auto;
      }
      .modal-title {
        font-size: 1.2em;
        font-weight: 800;
        color: #005a9e;
        margin: 0 0 20px;
      }
      .ff label {
        display: block;
        font-weight: 700;
        font-size: 12px;
        color: #495057;
        margin-bottom: 5px;
        text-transform: uppercase;
      }
      .ff input,
      .ff select {
        width: 100%;
        padding: 10px 13px;
        border: 1.5px solid #dee2e6;
        border-radius: 8px;
        font-size: 14px;
        font-family: inherit;
        box-sizing: border-box;
        margin-bottom: 12px;
      }
      .ff input:focus,
      .ff select:focus {
        border-color: #005a9e;
        outline: none;
        box-shadow: 0 0 0 3px rgba(0, 90, 158, 0.1);
      }
      .supplier-entry {
        background: #f8f9fa;
        border: 1.5px solid #dee2e6;
        border-radius: 10px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .supplier-entry-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .supplier-grid {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr 1fr;
        gap: 8px;
      }
      .add-supplier-btn {
        width: 100%;
        padding: 10px;
        border: 2px dashed #b3d4f5;
        border-radius: 9px;
        background: #f0f7ff;
        color: #005a9e;
        font-weight: 700;
        font-size: 14px;
        cursor: pointer;
        font-family: inherit;
        margin-bottom: 16px;
      }
      .remove-supplier-btn {
        background: #fff0f0;
        color: #dc3545;
        border: none;
        border-radius: 7px;
        padding: 5px 10px;
        cursor: pointer;
        font-weight: 700;
        font-family: inherit;
      }
      .modal-footer {
        display: flex;
        gap: 12px;
        justify-content: flex-end;
        margin-top: 16px;
      }
      .btn-primary {
        padding: 12px 24px;
        background: linear-gradient(135deg, #005a9e, #003d6e);
        color: #fff;
        border: none;
        border-radius: 9px;
        font-weight: 800;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
      }
      .btn-secondary {
        padding: 12px 24px;
        background: #e9ecef;
        color: #495057;
        border: none;
        border-radius: 9px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        font-family: inherit;
      }
    </style>
  </head>
  <body>
    <div id="navbar-root"></div>

    <div id="loading-bar" class="loading-bar hidden"></div>

    <div class="pg">
      <div class="sc">
        <div class="sc-title">
          <span>📦 Order Book</span>

          <button
            class="btn-secondary"
            onclick="manageProducts()"
            style="font-size: 13px; padding: 9px 18px; background: #f0f7ff; color: #005a9e; border: 1px solid #b3d4f5"
          >
            ⚙️ Manage Products
          </button>
          <button class="btn-primary" onclick="openNewOrderModal()" style="font-size: 13px; padding: 9px 18px">
            ➕ New Order
          </button>
        </div>

        <!-- Filter tabs -->
        <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap">
          <button
            class="status-badge status-pending"
            style="cursor: pointer; padding: 7px 16px"
            onclick="filterOrders('Pending')"
          >
            ⏳ Pending
          </button>
          <button
            class="status-badge status-partial"
            style="cursor: pointer; padding: 7px 16px"
            onclick="filterOrders('Partial')"
          >
            🔄 Partial
          </button>
          <button
            class="status-badge status-completed"
            style="cursor: pointer; padding: 7px 16px"
            onclick="filterOrders('Completed')"
          >
            ✅ Completed
          </button>
          <button
            class="status-badge status-cancelled"
            style="cursor: pointer; padding: 7px 16px"
            onclick="filterOrders('Cancelled')"
          >
            ❌ Cancelled
          </button>
          <button
            class="status-badge"
            style="cursor: pointer; padding: 7px 16px; background: #f8f9fa; border: 1px solid #dee2e6; color: #495057"
            onclick="filterOrders('All')"
          >
            📋 All
          </button>
        </div>

        <div id="order-list"></div>
      </div>
    </div>

    <!-- New/Edit Order Modal -->
    <!-- Isko order-book.html mein replace karna hai -->
    <div id="order-modal" class="modal-overlay">
      <div class="modal-box">
        <div class="modal-title" id="order-modal-title">➕ New Order</div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px">
          <div class="ff">
            <label>Order Date *</label>
            <input type="date" id="order-date" />
          </div>
          <div class="ff">
            <label>Broker Name</label>
            <input type="text" id="order-broker" placeholder="Broker name (optional)" />
          </div>
          <!-- Supplier Name Common Upar Aa Gaya -->
          <div class="ff">
            <label>Supplier Name *</label>
            <input
              type="text"
              id="order-supplier"
              placeholder="Enter supplier name"
              oninput="this.value=this.value.toUpperCase()"
            />
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">VILLAGE</label>
            <input type="text" id="order-village" class="form-control" placeholder="Village name" />
          </div>
          <div class="ff">
            <label>Notes</label>
            <input type="text" id="order-notes" placeholder="Any notes..." />
          </div>
        </div>

        <div
          style="
            font-weight: 800;
            font-size: 13px;
            color: #005a9e;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            margin-bottom: 10px;
            margin-top: 15px;
          "
        >
          Item Details (Vakal)
        </div>
        <div id="supplier-entries"></div>
        <button class="add-supplier-btn" onclick="addSupplierEntry()">➕ Add Vakal</button>

        <div class="modal-footer">
          <button class="btn-secondary" onclick="closeOrderModal()">Cancel</button>
          <button class="btn-primary" onclick="saveOrder()">💾 Save Order</button>
        </div>
      </div>
    </div>
    <script src="js/features/order-book.js" defer></script>
  </body>
</html>
