<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broker Ledger — MandiBook</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore-compat.js"></script>
    <script src="js/core/firebase-init.js?v=14"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/core-engine.js?v=14"></script>
    <script src="js/features/themes.js" defer></script>
    <script src="js/core/workspace-ui.js?v=14" defer></script>
    <script src="js/core/payment-ui.js" defer></script>
    <script src="js/core/financial-year.js" defer></script>
    <script src="js/features/broker.js?v=14" defer></script>
    <script src="js/core/pwa.js?v=14" defer></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="icon" href="assets/logo.jpg" />
    <style>
      body { background:#f4f8fc; }
      .pg { max-width:1100px; margin:0 auto; padding:30px 20px 46px; }
      .sc {
        background: #fff;
        border-radius: 18px;
        padding: 24px;
        margin-bottom: 18px;
        border: 1px solid #dee2e6;
        border-color:#d8e6f1; box-shadow:0 12px 29px rgba(14, 70, 111, .08);
      }
      .sc-title {
        font-size: 0.9em;
        font-weight: 800;
        color: #183f63;
        margin: 0 0 18px;
        padding-bottom: 11px;
        border-bottom: 1px solid #e8f0f6; text-transform:none; letter-spacing:0; font-size:15px;
      }
      .broker-card {
        background: #fff;
        width:100%; box-sizing:border-box; text-align:left; font-family:inherit;
        border: 1px solid #dbe7f0; border-radius: 14px;
        padding: 18px 19px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow:0 4px 12px rgba(0, 90, 158, .04);
      }
      .broker-card:hover {
        box-shadow: 0 4px 16px rgba(0, 90, 158, 0.15);
        border-color:#65a9d6; background:#f7fbff;
        transform: translateY(-2px);
      }
      .broker-name {
        font-weight: 800;
        font-size: 1.1em;
        color:#075f9f;
        margin-bottom: 10px;
      }
      .broker-stats {
        display: grid;
        grid-template-columns: repeat(4, minmax(0,1fr));
        gap: 10px;
      }
      .bs-val {
        display: block;
        font-size: 1.3em;
        font-weight: 800;
        color:#264761;
      }
      .bs-label {
        display: block;
        font-size: 11px;
        color: #6c757d;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-top: 2px;
      }
      .kpi-card {
        background: #f8f9fa;
        padding: 14px;
        border-radius: 10px;
        text-align: center;
        border: 1px solid #dee2e6;
      }
      .kpi-label {
        font-size: 12px;
        color: #6c757d;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .kpi-value {
        font-size: 1.5em;
        font-weight: 800;
        color:#075f9f;
      }
      .blt {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 6px;
      }
      .blt th {
        background:#e8f3fb; color:#456078;
        padding: 10px 12px;
        font-size: 12px;
        text-align: left;
      }
      .blt td {
        background: #fff;
        padding: 10px 12px;
        border-top: 1px solid #f0f0f0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px; color:#284860;
      }
      .broker-hero { display:flex; justify-content:space-between; align-items:center; gap:24px; padding:29px 31px; border-radius:21px; margin-bottom:19px; color:#fff; background:radial-gradient(circle at 87% 13%,rgba(95,190,255,.45),transparent 29%),linear-gradient(125deg,#063968,#0878bd); box-shadow:0 16px 37px rgba(7,75,123,.17); }
      .broker-kicker { margin:0 0 7px; color:#b7e0ff; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:1.25px; }
      .broker-hero h1 { margin:0; font-size:30px; letter-spacing:-.5px; }
      .broker-hero p:last-child { max-width:620px; margin:8px 0 0; color:#e1f2ff; line-height:1.55; }
      .broker-hero-badge { padding:9px 12px; border:1px solid rgba(255,255,255,.3); border-radius:999px; background:rgba(1,35,70,.22); font-size:12px; font-weight:800; white-space:nowrap; }
      .broker-overview { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:13px; margin-bottom:18px; }
      .broker-overview-card { padding:16px 17px; border:1px solid #d9e7f1; border-radius:15px; background:#fff; box-shadow:0 7px 15px rgba(37,81,118,.05); }
      .broker-overview-card span { display:block; color:#75899b; font-size:11px; font-weight:800; text-transform:uppercase; letter-spacing:.45px; }
      .broker-overview-card strong { display:block; margin-top:7px; color:#075e9d; font-size:22px; }
      .broker-directory-head { display:flex; justify-content:space-between; align-items:center; gap:15px; margin-bottom:18px; }
      .broker-directory-head small { display:block; margin-top:4px; color:#71869a; font-size:12px; font-weight:600; }
      .broker-add-button { border:0; border-radius:10px; padding:11px 14px; color:#fff; background:linear-gradient(135deg,#075e9d,#087ec2); font:700 13px inherit; cursor:pointer; box-shadow:0 7px 13px rgba(0,90,158,.2); white-space:nowrap; }
      .broker-empty { padding:36px 14px; text-align:center; color:#6f8295; border:1px dashed #cbdce9; border-radius:13px; background:#f8fbfd; }
      @media (max-width:700px) { .pg { padding:18px 13px 34px; } .broker-hero { padding:23px 20px; align-items:flex-start; flex-direction:column; } .broker-overview { grid-template-columns:1fr; gap:9px; } .sc { padding:17px; } .broker-stats { grid-template-columns:repeat(2,minmax(0,1fr)); gap:13px; } .broker-card { padding:16px; } .broker-directory-head { align-items:flex-start; flex-direction:column; } }
    </style>
    <link rel="stylesheet" href="css/workspaces.css?v=14" />
  </head>
  <body class="workspace-page">
    <div id="navbar-root"></div>
    <main class="pg broker-workspace">
      <section class="broker-hero">
        <div><p class="broker-kicker">Accounts workspace</p><h1>Broker commission</h1><p>One clean view of commission earned, payouts recorded, and balance due for every broker.</p></div>
        <span class="broker-hero-badge" id="broker-sync-status" aria-live="polite">Loading brokers…</span>
      </section>
      <div class="broker-overview" id="broker-overview"></div>
      <section class="sc">
        <div class="broker-directory-head"><div><div class="sc-title" style="margin-bottom:0; padding-bottom:0; border:0;">Broker directory</div><small>Open a broker to review bills and record a payout.</small></div><button class="broker-add-button" onclick="openAddBrokerModal()">＋ Add broker</button></div>
        <div class="workspace-field broker-search"><label for="broker-search">Find a broker</label><input id="broker-search" type="search" placeholder="Search broker name…" /></div>
        <p class="broker-result-label" id="broker-result-label" aria-live="polite"></p>
        <div id="broker-search-empty" hidden></div>
        <div id="broker-list">
          <div style="text-align: center; color: #6c757d; padding: 30px">Loading brokers...</div>
        </div>
      </section>
    </main>
  </body>
</html>
