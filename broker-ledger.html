<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Broker Ledger — MandiBook</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" />
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>
    <script src="js/core/firebase-init.js"></script>
    <script src="js/core/utils.js"></script>
    <script src="js/core/core-engine.js"></script>
    <script src="js/features/themes.js" defer></script>
    <script src="js/features/broker.js" defer></script>
    <link rel="stylesheet" href="css/main.css" />
    <link rel="stylesheet" href="css/themes.css" />
    <link rel="icon" href="assets/logo.jpg" />
    <style>
      .pg {
        max-width: 900px;
        margin: 0 auto;
      }
      .sc {
        background: #fff;
        border-radius: 14px;
        padding: 22px 24px;
        margin-bottom: 18px;
        border: 1px solid #dee2e6;
        box-shadow: 0 2px 10px rgba(0, 90, 158, 0.07);
      }
      .sc-title {
        font-size: 0.9em;
        font-weight: 800;
        color: #005a9e;
        margin: 0 0 18px;
        padding-bottom: 11px;
        border-bottom: 2px solid #e7f3ff;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .broker-card {
        background: #fff;
        border: 1.5px solid #dee2e6;
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 12px;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: 0 2px 8px rgba(0, 90, 158, 0.07);
      }
      .broker-card:hover {
        box-shadow: 0 4px 16px rgba(0, 90, 158, 0.15);
        border-color: #b3d4f5;
        transform: translateY(-2px);
      }
      .broker-name {
        font-weight: 800;
        font-size: 1.1em;
        color: #005a9e;
        margin-bottom: 10px;
      }
      .broker-stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
      }
      .bs-val {
        display: block;
        font-size: 1.3em;
        font-weight: 800;
        color: #343a40;
      }
      .bs-label {
        display: block;
        font-size: 11px;
        color: #6c757d;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.3px;
        margin-top: 2px;
      }
      .kpi-card {
        background: #f8f9fa;
        padding: 14px;
        border-radius: 10px;
        text-align: center;
        border: 1px solid #dee2e6;
      }
      .kpi-label {
        font-size: 12px;
        color: #6c757d;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .kpi-value {
        font-size: 1.5em;
        font-weight: 800;
        color: #005a9e;
      }
      .blt {
        width: 100%;
        border-collapse: separate;
        border-spacing: 0 6px;
      }
      .blt th {
        background: #005a9e;
        color: #fff;
        padding: 10px 12px;
        font-size: 12px;
        text-align: left;
      }
      .blt td {
        background: #fff;
        padding: 10px 12px;
        border-top: 1px solid #f0f0f0;
        border-bottom: 1px solid #f0f0f0;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="navbar-root"></div>
    <div class="pg">
      <div class="sc">
        <div class="sc-title">🤝 Broker Commission Ledger</div>
        <div id="broker-list">
          <div style="text-align: center; color: #6c757d; padding: 30px">Loading brokers...</div>
        </div>
      </div>
    </div>
  </body>
</html>
